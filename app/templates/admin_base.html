
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sweet Haven | Admin{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">

    <style>
        /* Admin page layout */
        .admin-page {
            min-height: 100vh;
            background: var(--page-bg, #faf7f0);
        }

        /* Separate admin navigation */
        .admin-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
            padding: 18px 5%;
            background: var(--page-bg, #fffdf8);
            border-bottom: 1px solid rgba(150, 115, 55, 0.18);
            box-shadow: 0 4px 18px rgba(60, 40, 20, 0.04);
        }

        .admin-header .brand {
            text-decoration: none;
            flex-shrink: 0;
        }

        .admin-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-menu a {
            text-decoration: none;
            color: var(--text-dark, #34291f);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 13px;
            border-radius: 8px;
            transition: 0.25s ease;
        }

        .admin-menu a:hover {
            background: rgba(177, 132, 57, 0.12);
            color: #98702d;
        }

        .admin-menu a.admin-active {
            background: rgba(177, 132, 57, 0.14);
            color: #98702d;
        }

        .admin-menu a.admin-logout {
            background: var(--gold, #b58a43);
            color: #fff;
            padding: 10px 18px;
        }

        .admin-menu a.admin-logout:hover {
            background: #967033;
            color: #fff;
        }

        /* Admin heading */
        .admin-page-heading {
            padding: 35px 5% 10px;
        }

        .admin-page-heading h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 600;
            color: var(--text-dark, #34291f);
        }

        .admin-page-heading p {
            margin: 8px 0 0;
            color: var(--text-muted, #81766a);
            font-size: 14px;
        }

        .admin-content {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 0 55px;
            min-height: 55vh;
        }

        /* Responsive navigation */
        @media (max-width: 900px) {
            .admin-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }

            .admin-menu {
                width: 100%;
            }
        }

        @media (max-width: 560px) {
            .admin-header {
                padding: 16px 5%;
            }

            .admin-menu {
                gap: 5px;
            }

            .admin-menu a {
                padding: 9px 10px;
                font-size: 12px;
            }

            .admin-content {
                width: 92%;
                padding-top: 18px;
            }

            .admin-page-heading {
                padding-top: 25px;
            }
        }

        
/* ==========================================
   ADMIN PANEL
========================================== */

.admin-page {
    min-height: 100vh;
    background: var(--cream);
    color: var(--text);
}

/* ADMIN HEADER */

.admin-header {
    min-height: 84px;
    padding: 16px 6%;
    background: rgba(12, 35, 25, .97);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(217, 173, 85, .5);
    backdrop-filter: blur(16px);
}

/* ADMIN BRAND */

.admin-header .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.admin-header .brand-emblem {
    color: var(--gold);
    font-size: 40px;
}

.admin-header .brand-name {
    display: block;
    font-family: "Playfair Display", serif;
    color: var(--gold-light);
    font-size: 27px;
    font-weight: 700;
    line-height: 1.2;
}

.admin-header .brand-tagline {
    display: block;
    font-size: 9px;
    letter-spacing: 3px;
    color: #e7d9b7;
}

/* ADMIN NAVIGATION */

.admin-menu {
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
}

.admin-menu a {
    position: relative;
    font-size: 13px;
    color: #eee9da;
    padding: 10px 0;
    transition: color .3s;
}

.admin-menu a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 2px;
    width: 0;
    height: 2px;
    background: var(--gold);
    transition: width .3s;
}

.admin-menu a:hover,
.admin-menu a.admin-active {
    color: var(--gold-light);
}

.admin-menu a:hover::after,
.admin-menu a.admin-active::after {
    width: 100%;
}

/* ADMIN LOGOUT BUTTON */

.admin-menu a.admin-logout {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 12px 24px;
    background: linear-gradient(
        120deg,
        var(--gold-light),
        var(--gold)
    );
    color: #30230e;
    border: 1px solid #f6dfa7;
    border-radius: 40px;
    font-weight: 700;
    box-shadow: 0 5px 18px rgba(217, 173, 85, .15);
    transition: transform .3s, box-shadow .3s;
}

.admin-menu a.admin-logout::after {
    display: none;
}

.admin-menu a.admin-logout:hover {
    color: #30230e;
    transform: translateY(-4px);
    box-shadow: 0 12px 26px rgba(217, 173, 85, .32);
}

/* ADMIN PAGE HEADING */

.admin-page-heading {
    padding: 40px 6% 15px;
}

.admin-page-heading h1 {
    font-family: "Playfair Display", serif;
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 700;
    color: var(--green);
    line-height: 1.3;
}

.admin-page-heading p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
}

/* ADMIN CONTENT */

.admin-content {
    width: 88%;
    max-width: 1400px;
    min-height: 55vh;
    margin: 0 auto;
    padding: 25px 0 55px;
}

/* ADMIN CARDS */

.admin-content .dashboard-card,
.admin-content .stat-card {
    background: var(--white);
    border: 1px solid var(--cream-dark);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
    transition: transform .3s, box-shadow .3s;
}

.admin-content .dashboard-card:hover,
.admin-content .stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(30, 37, 25, .14);
}

/* ADMIN TABLES */

.admin-content table {
    width: 100%;
    border-collapse: collapse;
    background: var(--white);
    border-radius: 12px;
    overflow: hidden;
}

.admin-content th {
    padding: 15px;
    background: var(--green);
    color: var(--gold-light);
    font-size: 13px;
    font-weight: 600;
    text-align: left;
}

.admin-content td {
    padding: 14px 15px;
    border-bottom: 1px solid var(--cream-dark);
    color: var(--text);
    font-size: 13px;
}

.admin-content tbody tr:hover {
    background: var(--cream);
}

/* ADMIN FORMS */

.admin-content input,
.admin-content select,
.admin-content textarea {
    max-width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--cream-dark);
    border-radius: 8px;
    background: var(--white);
    color: var(--text);
}

.admin-content input:focus,
.admin-content select:focus,
.admin-content textarea:focus {
    outline: 2px solid var(--gold);
    border-color: var(--gold);
}

/* RESPONSIVE ADMIN LAYOUT */

@media (max-width: 900px) {
    .admin-header {
        gap: 18px;
    }

    .admin-menu {
        gap: 18px;
    }

    .admin-content {
        width: 92%;
    }
}

@media (max-width: 600px) {
    .admin-header {
        padding: 16px 5%;
        position: relative;
    }

    .admin-menu {
        width: 100%;
        gap: 10px 18px;
    }

    .admin-menu a {
        font-size: 12px;
    }

    .admin-page-heading {
        padding: 28px 5% 10px;
    }

    .admin-content {
        width: 92%;
        padding-top: 18px;
        overflow-x: auto;
    }

    .admin-content table {
        min-width: 650px;
    }
}

    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

<div class="admin-page">

    <!-- Admin Header -->
    <header class="admin-header">

        <a href="/admin/dashboard" class="brand">
            <span class="brand-emblem">❋</span>

            <span class="brand-text">
                <span class="brand-name">Sweet Haven</span>
                <span class="brand-tagline">ADMINISTRATION</span>
            </span>
        </a>

        <!-- Separate Admin Navigation -->
        <nav class="admin-menu">

            <a href="/admin/dashboard"
               class="{% if request.url.path == '/admin/dashboard' %}admin-active{% endif %}">
                Dashboard
            </a>

            <a href="/admin/orders"
               class="{% if request.url.path.startswith('/admin/orders') %}admin-active{% endif %}">
                Manage Orders
            </a>

            <a href="/admin/products"
               class="{% if request.url.path.startswith('/admin/products') %}admin-active{% endif %}">
                Manage Products
            </a>

            <a href="/" target="_blank">
                View Store
            </a>

            <a href="/logout" class="admin-logout">
                Logout
            </a>

        </nav>

    </header>

    <!-- Page Heading -->
    <section class="admin-page-heading">
        <h1>{% block page_heading %}Admin Dashboard{% endblock %}</h1>
        <p>Manage your Sweet Haven store in one place.</p>
    </section>

    <!-- Admin Content -->
    <main class="admin-content">
        {% block content %}{% endblock %}
    </main>

</div>

<script src="{{ url_for('static', path='js/script.js') }}"></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
