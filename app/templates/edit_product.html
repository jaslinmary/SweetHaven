
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sweet | SweetHaven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-success text-white p-3">
            <h4 class="mb-0">Edit Sweet</h4>
        </div>

        <div class="card-body p-4">
            <form action="/admin/products/{{ product.id }}/edit" method="post">
                <div class="mb-3">
                    <label class="form-label">Sweet Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ product.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control"
                           value="{{ product.category }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" name="price" class="form-control"
                           value="{{ product.price }}" min="0.01" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control"
                           value="{{ product.stock }}" min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Image URL or Path</label>
                    <input type="text" name="image" class="form-control"
                           value="{{ product.image }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control"
                              rows="3" required>{{ product.description }}</textarea>
                </div>

                <button type="submit" class="btn btn-success">Save Changes</button>
                <a href="/admin/products" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
